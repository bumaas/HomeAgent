<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Agent</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --card: var(--color-background-secondary, #f6f8fa);
    --fg: var(--color-text-primary, #000000);
    --muted: var(--color-text-secondary, #656d76);
    --border: var(--color-border-tertiary, #d8dee4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #333438);
      --card: var(--color-background-secondary, #262626);
      --fg: var(--color-text-primary, #ffffff);
      --muted: var(--color-text-secondary, #9198a1);
      --border: var(--color-border-tertiary, #3d444d);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #333438);
    --card: var(--color-background-secondary, #262626);
    --fg: var(--color-text-primary, #ffffff);
    --muted: var(--color-text-secondary, #9198a1);
    --border: var(--color-border-tertiary, #3d444d);
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 13px/1.4 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); padding: 6px 4px 4px; }
  /* Mehrere Bilder stehen untereinander; ein Bild wird nie breiter als 720 px (Regelwerk DESIGN.md, Kamerabild) */
  .view { max-width: 720px; margin: 0 0 12px; }
  .view:last-child { margin-bottom: 0; }
  .title { font-weight: 600; margin: 0 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frame { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
  .frame.empty { aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; padding: 0 12px; text-align: center; box-sizing: border-box; }
  .frame img { display: block; width: 100%; height: auto; }
  .foot { color: var(--muted); font-size: 12px; margin: 6px 2px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  // Seite des Kamerabilds von Home Agent (MCP Apps, Erweiterung io.modelcontextprotocol/ui, Spezifikation 2026-01-26).
  // show_camera gibt dem Modell das Bild als Bildblock und dieser Seite in structuredContent, welche Kamera gemeint ist.
  // Ein Werkzeugergebnis über rund 150.000 Zeichen erreicht die Seite bei claude.ai nicht, das Bild für das Modell ist
  // größer. Die Seite holt ihr Bild deshalb selbst über tools/call an camera_image, das nur sie sieht
  // (_meta.ui.visibility ["app"]), in Stücken, und beginnt damit schon bei den Argumenten des Aufrufs. Kommt das
  // Ergebnis mit Bildblock an, nimmt sie den.
  var nextId = 1;
  var pending = {};
  var lang = (navigator.language || "de").slice(0, 2);
  var TYPES = ["image/jpeg", "image/png", "image/gif", "image/webp"];
  // Zustand: eine Liste von Bildern (heute genau eines), jedes mit Kamera, Bildquelle und Stand des Ladens
  var views = [];
  var labels = { taken: "%s", loading: "…", missing: "–" };
  var timeZone = "";
  var args = null;
  var started = false;

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    var id = nextId++;
    send({ jsonrpc: "2.0", id: id, method: method, params: params });
    return new Promise(function (resolve, reject) { pending[id] = { resolve: resolve, reject: reject }; });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params || {} }); }

  function applyContext(context) {
    if (!context) { return; }
    if (context.theme === "dark" || context.theme === "light") {
      document.documentElement.setAttribute("data-theme", context.theme);
    }
    var vars = context.styles && context.styles.variables;
    if (vars) {
      Object.keys(vars).forEach(function (key) {
        if (vars[key]) { document.documentElement.style.setProperty(key, vars[key]); }
      });
    }
    if (context.locale) { lang = String(context.locale).slice(0, 2); draw(); }
  }

  var lastHeight = 0;
  // Höhe des Inhalts, nicht des Rahmens (wie bei Karten und Diagramm, sonst bleibt ein Scrollbalken).
  function reportSize() {
    var height = Math.ceil(document.getElementById("root").getBoundingClientRect().bottom + 8);
    if (height !== lastHeight) {
      lastHeight = height;
      notify("ui/notifications/size-changed", { width: Math.ceil(document.body.getBoundingClientRect().width), height: height });
    }
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) { el.className = className; }
    if (text !== undefined) { el.textContent = text; }
    return el;
  }

  // Aufnahmezeit in der Sprache des Clients und der Zeitzone der Anlage: „Dienstag, 10. November, 12:33“
  function when(taken) {
    var date = new Date(taken * 1000);
    var options = { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" };
    try {
      if (timeZone) { options.timeZone = timeZone; }
      return date.toLocaleString(lang, options);
    } catch (e) {
      delete options.timeZone;
      return date.toLocaleString(undefined, options);
    }
  }

  function draw() {
    var root = document.getElementById("root");
    root.textContent = "";
    views.forEach(function (view) {
      var box = node("div", "view");
      if (view.name) { box.appendChild(node("div", "title", (view.room ? view.room + " · " : "") + view.name)); }
      if (view.src) {
        var frame = node("div", "frame");
        var img = node("img");
        img.alt = view.name || "";
        img.addEventListener("load", reportSize);
        img.addEventListener("error", function () { view.src = null; view.failed = true; draw(); });
        img.src = view.src;
        frame.appendChild(img);
        box.appendChild(frame);
      } else {
        box.appendChild(node("div", "frame empty", view.failed ? (view.reason || labels.missing) : labels.loading));
      }
      if (view.taken) { box.appendChild(node("div", "foot", labels.taken.replace("%s", when(view.taken)))); }
      root.appendChild(box);
    });
    reportSize();
  }

  function adopt(view, data) {
    ["device", "room", "name", "taken"].forEach(function (key) { if (data[key] !== undefined) { view[key] = data[key]; } });
  }
  function texts(data) {
    if (data.labels) { Object.keys(labels).forEach(function (key) { if (data.labels[key]) { labels[key] = data.labels[key]; } }); }
    if (data.timeZone) { timeZone = data.timeZone; }
  }

  // Bild einer Ansicht in Stücken holen: das erste nennt die Gesamtlänge, die übrigen kommen gleichzeitig. Ändert sich
  // das Bild zwischendurch (Aufnahmezeit oder Länge), beginnt das Laden neu. „quiet“: Scheitert schon das erste Stück,
  // bleibt die Ansicht leer; die Absage steht dann im Text der Antwort (keine oder mehrere Kameras).
  function load(view, target, attempt, quiet) {
    function fail(reason) {
      if (quiet && !view.device) {
        views = views.filter(function (v) { return v !== view; });
      } else {
        view.failed = true;
        view.reason = reason || "";
      }
      view.loading = false;
      draw();
    }
    function part(query) {
      return request("tools/call", { name: "camera_image", arguments: query }).then(function (result) {
        var data = result && result.structuredContent;
        if (!data || result.isError || data.kind !== "camera_part" || !data.data || TYPES.indexOf(data.mimeType) < 0) {
          var said = result && result.isError && result.content && result.content[0] && result.content[0].text;
          throw { reason: said ? String(said).split("\n")[0] : "" };
        }
        return data;
      });
    }
    var query = {};
    Object.keys(target).forEach(function (key) { if (target[key]) { query[key] = target[key]; } });
    view.loading = true;
    part(query).then(function (first) {
      texts(first);
      adopt(view, first);
      draw();
      var offsets = [];
      for (var offset = first.data.length; offset < first.total; offset += first.data.length) { offsets.push(offset); }
      return Promise.all(offsets.map(function (offset) { return part({ device: first.device, offset: offset }); })).then(function (rest) {
        if (rest.some(function (p) { return p.total !== first.total || p.taken !== first.taken; })) {
          if (attempt < 2) { load(view, { device: first.device }, attempt + 1, false); } else { fail(""); }
          return;
        }
        view.src = "data:" + first.mimeType + ";base64," + first.data + rest.map(function (p) { return p.data; }).join("");
        view.loading = false;
        draw();
      });
    }).catch(function (error) { fail(error && error.reason); });
  }

  // Ergebnis von show_camera: welche Kamera, und wenn der Host ihn durchlässt, der Bildblock selbst
  function render(result) {
    var data = result && result.structuredContent;
    var images = ((result && result.content) || []).filter(function (c) { return c && c.type === "image" && c.data && TYPES.indexOf(c.mimeType) >= 0; });
    if (data && data.kind === "camera" && data.images && data.images.length) {
      texts(data);
      // Lädt die Seite schon mit den Argumenten (oder ist fertig), kommt nur dazu, was das Ergebnis mehr weiß. Sonst
      // lüde sie dasselbe Bild zweimal (Claude-App 10.11.2026: sechs Aufrufe statt drei).
      var running = views.length === 1 && data.images.length === 1 && (views[0].loading || views[0].src);
      if (!running) {
        views = data.images.map(function () { return {}; });
      }
      started = true;
      views.forEach(function (view, index) {
        adopt(view, data.images[index]);
        if (images[index]) {
          view.src = "data:" + images[index].mimeType + ";base64," + images[index].data;
        }
      });
      draw();
      views.forEach(function (view) { if (!view.src && !view.loading) { load(view, { device: view.device }, 0, false); } });
    } else if (result && result.isError) {
      // Eine Absage (keine oder mehrere Kameras) steht im Text der Antwort, die Ansicht bleibt leer
      started = true;
    } else if (!started) {
      fromArguments();
    }
  }

  // Mit den Argumenten des Aufrufs fragen, camera_image sucht dann wie show_camera. So erscheint das Bild, während das
  // Modell noch auf sein Ergebnis wartet, und auch dann, wenn der Host der Seite das Ergebnis nicht gibt.
  function fromArguments() {
    if (started) { return; }
    started = true;
    views = [{}];
    draw();
    load(views[0], { name: (args && args.name) || "", room: (args && args.room) || "" }, 0, true);
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) { return; }
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") { return; }
    if (msg.id !== undefined && pending[msg.id] && (msg.result !== undefined || msg.error !== undefined)) {
      var entry = pending[msg.id];
      delete pending[msg.id];
      if (msg.error) { entry.reject(msg.error); } else { entry.resolve(msg.result); }
      return;
    }
    if (msg.method === "ui/notifications/tool-input") {
      args = (msg.params || {}).arguments || {};
      // Nicht aufs Ergebnis warten: In der Claude-App kam es über vier Sekunden nach dem Aufruf (10.11.2026).
      setTimeout(fromArguments, 300);
    } else if (msg.method === "ui/notifications/tool-result") {
      render(msg.params || {});
    } else if (msg.method === "ui/notifications/host-context-changed") {
      applyContext(msg.params);
    } else if (msg.id !== undefined && msg.method) {
      // ping, ui/resource-teardown und Ähnliches: ohne Aufwand bestätigen
      send({ jsonrpc: "2.0", id: msg.id, result: {} });
    }
  });

  if (window.ResizeObserver) { new ResizeObserver(reportSize).observe(document.documentElement); }

  request("ui/initialize", {
    appCapabilities: {},
    appInfo: { name: "Home Agent camera", version: "1.0.0" },
    protocolVersion: "2026-01-26"
  }).then(function (result) {
    applyContext(result && result.hostContext);
    notify("ui/notifications/initialized");
  }, function () {
    notify("ui/notifications/initialized");
  });
})();
</script>
</body>
</html>
