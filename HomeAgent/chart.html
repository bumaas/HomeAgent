<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Agent</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --fg: var(--color-text-primary, #1f2328);
    --muted: var(--color-text-secondary, #656d76);
    --grid: var(--color-border-tertiary, #d8dee4);
    --inactive: #afb8c1;
    --heat-mid: #f2f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1e1e1e);
      --fg: var(--color-text-primary, #e6edf3);
      --muted: var(--color-text-secondary, #9198a1);
      --grid: var(--color-border-tertiary, #3d444d);
      --inactive: #545d68;
      --heat-mid: #3a3f46;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1e1e1e);
    --fg: var(--color-text-primary, #e6edf3);
    --muted: var(--color-text-secondary, #9198a1);
    --grid: var(--color-border-tertiary, #3d444d);
    --inactive: #545d68;
    --heat-mid: #3a3f46;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 13px/1.4 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); padding: 8px 4px 4px; }
  .chart { margin-bottom: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 4px 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend i.bar { height: 10px; }
  .note { color: var(--muted); margin: 0 0 0 6px; font-size: 12px; }
  .title { font-weight: 600; margin: 0 0 6px 6px; }
  .scale { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 6px; color: var(--muted); font-size: 12px; }
  .scale i { display: inline-block; width: 160px; height: 8px; border-radius: 4px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); padding: 12px 6px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 2px 0 0 6px; color: var(--muted); font-size: 12px; }
  .controls label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .rings { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .ring { flex: 1 1 190px; border: 1px solid var(--grid); border-radius: 10px; padding: 8px 6px 2px; box-sizing: border-box; }
  .ring svg { max-height: 270px; }
  .ring h3 { margin: 0 0 0 6px; font-size: 13px; font-weight: 600; color: var(--fg); }
  .ring svg text.part { font-size: 12px; font-weight: 600; }
  .ring svg text.part tspan.value { fill: var(--fg); }
  .ring svg text.center { fill: var(--fg); font-size: 26px; font-weight: 700; }
  .ring svg text.sub { font-size: 11px; }
</style>
</head>
<body>
<div id="root"><div class="empty">…</div></div>
<script>
(function () {
  "use strict";
  // Seite für das Werkzeug show_chart von Home Agent (MCP Apps, Erweiterung io.modelcontextprotocol/ui, Spezifikation
  // 2026-01-26). Sie meldet sich mit ui/initialize beim Client an, bekommt mit ui/notifications/tool-result die Werte
  // in structuredContent und zeichnet je Einheit ein Diagramm: Band von Minimum bis Maximum, Linie für das Mittel.
  var COLORS = ["#2f81f7", "#e5534b", "#3fb950", "#d29922", "#a371f7"];
  // Modellkurve der Punktwolke: gestrichelt in Gelb, neben den blauen Punkten und den Klassenmitteln in Textfarbe
  var SCATTER_TREND = "#d29922";
  var CHOICE_COLORS = ["#2f81f7", "#14b8a6", "#d29922", "#a371f7", "#8c959f"];
  // Stapel des Hausverbrauchs (kind "consumption"): Netz, PV direkt, Batterie, Einspeisung unter der Nulllinie
  // Verbrauch je Gerät: Geräte in den Farben der Linien, die übrigen grau, „nicht erfasst“ hellgrau
  // Farben wie in den Ringen (Anregung pitti, Forum t/144633): PV gelb, Batterie türkis, Netz orangerot, Einspeisung grün
  var STACK_COLORS = { grid: "#e8603c", solar: "#f2b705", battery: "#14b8a6", export: "#4caf50", other: "#8c959f", unmetered: "#d0d7de" };
  var nextId = 1;
  var pending = {};
  var lang = (navigator.language || "de").slice(0, 2);
  // Band von Minimum bis Maximum: null = automatisch (bei einer Reihe je Diagramm an, bei mehreren aus, sonst
  // überlagern sie sich), true/false = vom Schalter gewählt (Burkhard 12.10.2026: „das Band ist nicht immer gewollt“).
  var bandChoice = null;
  var lastData = null;

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    var id = nextId++;
    send({ jsonrpc: "2.0", id: id, method: method, params: params });
    return new Promise(function (resolve, reject) { pending[id] = { resolve: resolve, reject: reject }; });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params || {} }); }

  function applyContext(context) {
    if (!context) { return; }
    if (context.theme === "dark" || context.theme === "light") {
      document.documentElement.setAttribute("data-theme", context.theme);
    }
    var vars = context.styles && context.styles.variables;
    if (vars) {
      Object.keys(vars).forEach(function (key) {
        if (vars[key]) { document.documentElement.style.setProperty(key, vars[key]); }
      });
    }
    if (context.locale) { lang = String(context.locale).slice(0, 2); }
  }

  var lastHeight = 0;
  // Höhe des Inhalts, nicht des Rahmens: sonst meldet die Seite die Höhe, die der Client ihr gerade gibt, und es
  // bleibt ein Scrollbalken (claude.ai, 12.10.2026).
  function reportSize() {
    var height = Math.ceil(document.getElementById("root").getBoundingClientRect().bottom + 8);
    if (height !== lastHeight) {
      lastHeight = height;
      notify("ui/notifications/size-changed", { width: Math.ceil(document.body.getBoundingClientRect().width), height: height });
    }
  }

  function el(name, attrs, text) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", name);
    Object.keys(attrs || {}).forEach(function (key) { node.setAttribute(key, attrs[key]); });
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  // Werte unter 1 mit zwei Nachkommastellen, sonst eine: 0,04 kWh einer Stunde stand vorher als „0“ im Tooltip
  function number(value) {
    return value.toLocaleString(lang, { maximumFractionDigits: Math.abs(value) < 1 ? 2 : 1 });
  }
  // Achse mit so vielen Nachkommastellen, wie die Schrittweite braucht (0,025 / 0,5 / 5); vorher „0,1 / 0 / 0 / 0“
  function axisNumber(value, step) {
    var digits = (String(Number(step.toFixed(6))).split(".")[1] || "").length;
    return Number(value.toFixed(digits)).toLocaleString(lang, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  function timeLabel(seconds, per, spansDays) {
    var d = new Date(seconds * 1000);
    if (per === "hour") {
      var hm = d.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
      return spansDays ? d.toLocaleDateString(lang, { day: "2-digit", month: "2-digit" }) + " " + hm : hm;
    }
    if (per === "month") { return d.toLocaleDateString(lang, { month: "short", year: "2-digit" }); }
    return d.toLocaleDateString(lang, { day: "2-digit", month: "2-digit" });
  }

  // Zeitmarken auf runden Zeitpunkten: volle Stunden (1, 2, 3, 4, 6, 12 h), ganze Tage (1, 2, 3, 7, 14) oder
  // Monatsanfänge, höchstens sechs. Vorher teilte die Seite den Zeitraum gleichmäßig (03:12, 06:24 …).
  function timeTicks(t0, t1, per) {
    var ticks = [], d;
    if (per === "month") {
      var months = Math.round((t1 - t0) / (30 * 86400)) + 1;
      var stepM = [1, 2, 3, 6, 12].filter(function (s) { return months / s <= 6; })[0] || 12;
      d = new Date(t0 * 1000);
      d.setDate(1);
      d.setHours(0, 0, 0, 0);
      if (d.getTime() / 1000 < t0) { d.setMonth(d.getMonth() + 1); }
      while (d.getTime() / 1000 <= t1) { ticks.push(d.getTime() / 1000); d.setMonth(d.getMonth() + stepM); }
      return ticks;
    }
    var hours = (t1 - t0) / 3600;
    var stepH = [1, 2, 3, 4, 6, 12, 24, 48, 72, 168, 336].filter(function (s) { return hours / s <= 6; })[0] || 336;
    d = new Date(t0 * 1000);
    d.setMinutes(0, 0, 0);
    if (stepH >= 24) {
      d.setHours(0);
    } else {
      d.setHours(Math.floor(d.getHours() / stepH) * stepH);
    }
    while (d.getTime() / 1000 < t0) { advance(d, stepH); }
    while (d.getTime() / 1000 <= t1) { ticks.push(d.getTime() / 1000); advance(d, stepH); }
    return ticks;
  }
  function advance(d, stepH) {
    if (stepH >= 24) { d.setDate(d.getDate() + stepH / 24); } else { d.setHours(d.getHours() + stepH); }
  }

  function niceStep(range) {
    var raw = range / 4;
    var power = Math.pow(10, Math.floor(Math.log10(raw)));
    var factor = raw / power;
    return (factor <= 1 ? 1 : factor <= 2 ? 2 : factor <= 5 ? 5 : 10) * power;
  }

  function drawGroup(container, unit, series, data, colorOffset, showBand, range) {
    var W = 640, H = 240, L = 44, R = 10, T = 8, B = 26;
    var times = [], low = Infinity, high = -Infinity;
    series.forEach(function (s) {
      s.points.concat(s.compare || []).forEach(function (p) { times.push(p[0]); low = Math.min(low, p[1]); high = Math.max(high, p[3]); });
    });
    if (!times.length) { return; }
    var t0 = range ? range[0] : Math.min.apply(null, times), t1 = range ? range[1] : Math.max.apply(null, times);
    if (t1 === t0) { t1 = t0 + 3600; }
    if (high === low) { high += 1; low -= 1; }
    var step = niceStep(high - low);
    var y0 = Math.floor(low / step) * step, y1 = Math.ceil(high / step) * step;
    var x = function (t) { return L + (t - t0) / (t1 - t0) * (W - L - R); };
    var y = function (v) { return T + (y1 - v) / (y1 - y0) * (H - T - B); };

    var box = document.createElement("div");
    box.className = "chart";
    var legend = document.createElement("div");
    legend.className = "legend";
    series.forEach(function (s, i) {
      var item = document.createElement("span");
      var mark = document.createElement("i");
      mark.style.background = COLORS[(i + colorOffset) % COLORS.length];
      item.appendChild(mark);
      item.appendChild(document.createTextNode(s.room + " · " + s.name + (unit ? " (" + unit + ")" : "")));
      legend.appendChild(item);
    });
    if (data.compare && series.some(function (s) { return s.compare && s.compare.length; })) {
      legend.appendChild(compareItem(data, "dashed"));
    }
    box.appendChild(legend);

    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    for (var v = y0; v <= y1 + step / 2; v += step) {
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, axisNumber(v, step)));
    }
    var spansDays = (t1 - t0) > 86400;
    timeTicks(t0, t1, data.per).forEach(function (t) {
      var px = x(t);
      var anchor = px < L + 20 ? "start" : px > W - R - 20 ? "end" : "middle";
      svg.appendChild(el("line", { x1: px, x2: px, y1: H - B, y2: H - B + 4, stroke: "var(--grid)", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: px, y: H - 8, "text-anchor": anchor }, timeLabel(t, data.per, spansDays && data.per === "hour")));
    });
    series.forEach(function (s, i) {
      var color = COLORS[(i + colorOffset) % COLORS.length];
      var top = s.points.map(function (p) { return x(p[0]) + "," + y(p[3]); });
      var bottom = s.points.slice().reverse().map(function (p) { return x(p[0]) + "," + y(p[1]); });
      if (showBand) {
        svg.appendChild(el("polygon", { points: top.concat(bottom).join(" "), fill: color, "fill-opacity": 0.15, stroke: "none" }));
      }
      if (s.compare && s.compare.length) {
        svg.appendChild(el("polyline", { points: s.compare.map(function (p) { return x(p[0]) + "," + y(p[2]); }).join(" "), fill: "none", stroke: color, "stroke-width": 1.5, "stroke-dasharray": "5 4", opacity: 0.75, "stroke-linejoin": "round" }));
      }
      svg.appendChild(el("polyline", { points: s.points.map(function (p) { return x(p[0]) + "," + y(p[2]); }).join(" "), fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
      s.points.forEach(function (p) {
        var dot = el("circle", { cx: x(p[0]), cy: y(p[2]), r: 6, fill: "transparent" });
        dot.appendChild(el("title", {}, timeLabel(p[0], data.per, true) + ": " + number(p[1]) + " / " + number(p[2]) + " / " + number(p[3]) + (unit ? " " + unit : "")));
        svg.appendChild(dot);
      });
    });
    box.appendChild(svg);
    container.appendChild(box);
  }

  // Vergleich zweier Zeiträume (B69): gestrichelte Linie beim Verlauf, Marke je Balken beim Verbrauch
  function compareText(data) {
    return ((data.labels && data.labels.compare) || "comparison") + " " + (data.compare.range ? periodText(data.compare.range) : data.compare.label);
  }

  // Titelzeile mit dem Zeitraum (Burkhard 13.10.2026 in der Claude-App: „mir fehlt im diagramm das datum“), in der Sprache
  // der App: ein Tag mit Wochentag, ein Monat mit Namen, ein Jahr als Zahl, sonst von–bis; mit Uhrzeit, wenn der Zeitraum
  // nicht um Mitternacht beginnt oder endet.
  function dateText(t, opts) { return new Date(t * 1000).toLocaleDateString(lang, opts); }
  function clockText(d) { return d.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" }); }
  function periodText(range) {
    var a = new Date(range[0] * 1000), e = new Date(range[1] * 1000), b = new Date((range[1] - 1) * 1000);
    var midnight = function (d) { return d.getHours() === 0 && d.getMinutes() === 0; };
    var numeric = { day: "2-digit", month: "2-digit", year: "numeric" };
    if (!midnight(a) || !midnight(e)) {
      return dateText(range[0], numeric) + ", " + clockText(a) + "–" + (a.toDateString() === b.toDateString() ? "" : dateText(range[1], numeric) + ", ") + clockText(e);
    }
    if (a.toDateString() === b.toDateString()) {
      return dateText(range[0], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }
    if (a.getDate() === 1 && e.getDate() === 1) {
      var months = (e.getFullYear() - a.getFullYear()) * 12 + e.getMonth() - a.getMonth();
      if (months === 1) { return dateText(range[0], { month: "long", year: "numeric" }); }
      if (months === 12 && a.getMonth() === 0) { return String(a.getFullYear()); }
    }
    var sameYear = a.getFullYear() === b.getFullYear();
    return dateText(range[0], sameYear ? { day: "2-digit", month: "2-digit" } : numeric) + "–" + dateText(range[1] - 1, numeric);
  }
  function addTitle(container, data) {
    var text = "";
    if (data && data.range) {
      text = periodText(data.range);
    } else if (data && data.at) {
      text = dateText(data.at, { day: "2-digit", month: "2-digit", year: "numeric" }) + ", " + clockText(new Date(data.at * 1000));
    }
    if (!text) { return; }
    if (data.compare && data.compare.range) { text += " · " + compareText(data); }
    var title = document.createElement("div");
    title.className = "title";
    title.textContent = text;
    container.appendChild(title);
  }
  function compareItem(data, style) {
    var item = document.createElement("span");
    var mark = document.createElement("i");
    if (style === "dashed") {
      mark.style.background = "repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px)";
    } else {
      mark.style.background = "var(--fg)";
    }
    item.appendChild(mark);
    item.appendChild(document.createTextNode(compareText(data)));
    return item;
  }

  // Verbrauch als Stapeldiagramm: je Zeitraum ein Balken, positive Reihen übereinander, negative darunter. Beschriftet
  // wird jeder k-te Balken, höchstens sechs.
  function drawBars(container, data) {
    var W = 640, H = 240, L = 44, R = 10, T = 8, B = 26;
    var times = data.times || [], n = times.length;
    if (!n) { return; }
    var high = 0, low = 0;
    times.forEach(function (t, i) {
      var up = 0, down = 0;
      data.series.forEach(function (s) { var v = s.values[i] || 0; if (v > 0) { up += v; } else { down += v; } });
      high = Math.max(high, up, data.compare && data.compare.values ? data.compare.values[i] || 0 : 0);
      low = Math.min(low, down);
    });
    // Ein paar Wattstunden Einspeisung sollen keinen Bereich unter der Nulllinie aufmachen
    if (-low < high * 0.03) { low = 0; }
    if (high === low) { high = 1; }
    var step = niceStep(high - low);
    var y0 = Math.floor(low / step) * step, y1 = Math.ceil(high / step) * step;
    var y = function (v) { return T + (y1 - v) / (y1 - y0) * (H - T - B); };
    var slot = (W - L - R) / n, width = Math.max(1, slot * 0.7);
    var unit = data.unit || "";
    var devices = 0;
    var colors = data.series.map(function (s) { return STACK_COLORS[s.key] || COLORS[devices++ % COLORS.length]; });

    var box = document.createElement("div");
    box.className = "chart";
    var legend = document.createElement("div");
    legend.className = "legend";
    data.series.forEach(function (s, j) {
      var item = document.createElement("span");
      var mark = document.createElement("i");
      mark.className = "bar";
      mark.style.background = colors[j];
      item.appendChild(mark);
      item.appendChild(document.createTextNode(s.name));
      legend.appendChild(item);
    });
    var compared = data.compare && data.compare.values ? data.compare.values : null;
    if (compared) { legend.appendChild(compareItem(data, "mark")); }
    box.appendChild(legend);

    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    for (var v = y0; v <= y1 + step / 2; v += step) {
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": Math.abs(v) < step / 2 ? 1.5 : 1 }));
      svg.appendChild(el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, axisNumber(v, step)));
    }
    var every = Math.ceil(n / 6);
    var spansDays = data.per === "hour" && (times[n - 1] - times[0]) >= 86400;
    times.forEach(function (t, i) {
      var cx = L + (i + 0.5) * slot;
      var up = 0, down = 0, tip = [timeLabel(t, data.per, true)];
      data.series.forEach(function (s, j) {
        var value = s.values[i] || 0;
        if (value === 0) { return; }
        var from = value > 0 ? up : down, to = from + value;
        if (value > 0) { up = to; } else { down = to; }
        svg.appendChild(el("rect", { x: cx - width / 2, y: y(Math.max(from, to)), width: width, height: Math.max(0.5, Math.abs(y(from) - y(to))), fill: colors[j] }));
        tip.push(s.name + ": " + number(value) + (unit ? " " + unit : ""));
      });
      if (compared && compared[i] !== undefined && compared[i] > 0) {
        svg.appendChild(el("line", { x1: cx - width / 2 - 1, x2: cx + width / 2 + 1, y1: y(compared[i]), y2: y(compared[i]), stroke: "var(--fg)", "stroke-width": 2 }));
        tip.push(compareText(data) + ": " + number(compared[i]) + (unit ? " " + unit : ""));
      }
      var hit = el("rect", { x: cx - slot / 2, y: T, width: slot, height: H - T - B, fill: "transparent" });
      hit.appendChild(el("title", {}, tip.join("\n")));
      svg.appendChild(hit);
      if (i % every === 0) {
        svg.appendChild(el("text", { x: cx, y: H - 8, "text-anchor": i === 0 && slot < 30 ? "start" : "middle" }, timeLabel(t, data.per, spansDays)));
      }
    });
    box.appendChild(svg);
    container.appendChild(box);
  }

  // Ringe für Autarkie, Eigenverbrauch und Leistung (Anregung pitti, Forum t/144633 #5): je Teil ein Bogen über drei
  // Viertel eines Kreises, von oben im Uhrzeigersinn, innen kleiner. Die Teile stehen links neben dem Anfang ihres
  // Bogens, außen die Skala (Prozent des Bezugs oder kW), in der Mitte die Zahl.
  function arc(cx, cy, r, from, to) {
    var a0 = from * 270 * Math.PI / 180, a1 = to * 270 * Math.PI / 180;
    var x0 = cx + r * Math.sin(a0), y0 = cy - r * Math.cos(a0), x1 = cx + r * Math.sin(a1), y1 = cy - r * Math.cos(a1);
    return "M" + x0 + "," + y0 + " A" + r + "," + r + " 0 " + ((to - from) * 270 > 180 ? 1 : 0) + " 1 " + x1 + "," + y1;
  }
  function amount(value, unit) {
    if (unit === "W") {
      return Math.abs(value) >= 1000 ? (Math.round(value / 100) / 10).toLocaleString(lang) + " kW" : Math.round(value).toLocaleString(lang) + " W";
    }
    return (Math.abs(value) >= 100 ? Math.round(value) : Math.round(value * 10) / 10).toLocaleString(lang) + " " + unit;
  }
  function drawRing(container, ring) {
    var W = 300, H = 270, cx = 150, cy = 148, width = 15, gap = 6, outer = 96;
    var box = document.createElement("div");
    box.className = "ring";
    var title = document.createElement("h3");
    title.textContent = ring.title;
    box.appendChild(title);
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    var power = ring.unit === "W" && ring.max;
    var scale = power ? ring.max : ring.total;
    // Skala außen: 0 bis 100 % in Zehnern, bei der Leistung ganze kW (höchstens zehn Schritte)
    var steps = 10, kw = power ? ring.max / 1000 : 0;
    if (power) { steps = kw <= 2 ? kw * 2 : kw <= 10 ? kw : 10; }
    for (var i = 0; i <= steps; i++) {
      var a = i / steps * 270 * Math.PI / 180, rr = outer + width / 2 + 14;

      svg.appendChild(el("text", { x: px, y: H - B + 16, "text-anchor": px < L + 20 ? "start" : px > W - R - 20 ? "end" : "middle" }, axisNumber(u, sx)));
    }

    // endeten die Linien bei der letzten vollen Stunde und die Bänder bei jetzt.
    // Ganzer Zeitraum aus data.range (bis zu seinem Ende, auch wenn er noch läuft), sonst aus Punkten und Bändern
    var range = data.range || null;
    if (!range && data.bands && data.bands.length) {
      range = [Infinity, -Infinity];
      data.series.forEach(function (s) { s.points.forEach(function (p) { range[0] = Math.min(range[0], p[0]); range[1] = Math.max(range[1], p[0]); }); });
      data.bands.forEach(function (b) { range[0] = Math.min(range[0], b.from); range[1] = Math.max(range[1], b.to); });
    }
    var showBand = bandChoice !== null ? bandChoice : order.every(function (unit) { return groups[unit].length === 1; });
    var offset = 0;
    order.forEach(function (unit) {
      drawGroup(root, unit, groups[unit], data, offset, showBand, range);
      offset += groups[unit].length;
    });
    drawBands(root, data.bands, range);
    var labels = data.labels || {};
    var controls = document.createElement("div");
    controls.className = "controls";
    var note = document.createElement("span");
    note.textContent = (labels.per ? labels.per + ": " : "") + (showBand ? [labels.minimum, labels.average, labels.maximum] : [labels.average]).filter(Boolean).join(" / ");
    controls.appendChild(note);
    var toggle = document.createElement("label");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = showBand;
    box.addEventListener("change", function () { bandChoice = box.checked; render(lastData); });
    toggle.appendChild(box);
    toggle.appendChild(document.createTextNode(labels.band || "min - max"));
    controls.appendChild(toggle);
    root.appendChild(controls);
    reportSize();
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) { return; }
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") { return; }
    if (msg.id !== undefined && pending[msg.id] && (msg.result !== undefined || msg.error !== undefined)) {
      var entry = pending[msg.id];
      delete pending[msg.id];
      if (msg.error) { entry.reject(msg.error); } else { entry.resolve(msg.result); }
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      render((msg.params || {}).structuredContent);
    } else if (msg.method === "ui/notifications/host-context-changed") {
      applyContext(msg.params);
    } else if (msg.id !== undefined && msg.method) {
      // ping, ui/resource-teardown und Ähnliches: ohne Aufwand bestätigen
      send({ jsonrpc: "2.0", id: msg.id, result: {} });
    }
  });

  if (window.ResizeObserver) { new ResizeObserver(reportSize).observe(document.documentElement); }

  request("ui/initialize", {
    appCapabilities: {},
    appInfo: { name: "Home Agent chart", version: "1.0.0" },
    protocolVersion: "2026-01-26"
  }).then(function (result) {
    applyContext(result && result.hostContext);
    notify("ui/notifications/initialized");
  }, function () {
    notify("ui/notifications/initialized");
  });
})();
</script>
</body>
</html>
