<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Agent</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --card: var(--color-background-secondary, #f6f8fa);
    --fg: var(--color-text-primary, #000000);
    --muted: var(--color-text-secondary, #656d76);
    --border: var(--color-border-tertiary, #d8dee4);
    --accent: #2f81f7;
    --on: #3fb950;
    --error: #e5534b;
    --inactive: #afb8c1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #333438);
      --card: var(--color-background-secondary, #262626);
      --fg: var(--color-text-primary, #ffffff);
      --muted: var(--color-text-secondary, #9198a1);
      --border: var(--color-border-tertiary, #3d444d);
      --inactive: #545d68;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #333438);
    --card: var(--color-background-secondary, #262626);
    --fg: var(--color-text-primary, #ffffff);
    --muted: var(--color-text-secondary, #9198a1);
    --border: var(--color-border-tertiary, #3d444d);
    --inactive: #545d68;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 13px/1.4 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); padding: 6px 4px 4px; }
  /* Gestaltung nach pitti (Forum, 13.10.2026): Gruppen je Art, Symbol, Farbe nach Zustand, Wert groß rechts, Balken. */
  .group { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin: 10px 2px 6px; }
  .group:first-child { margin-top: 2px; }
  /* Jede Karte behält ihre Höhe: gestreckt neben dem Luftentfeuchter stand der Wert einer Temperatur weit unten */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; align-items: start; }
  .card { --tone: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  /* Kein Hintergrundverlauf auf aktiven Karten: pitti hat sich dagegen entschieden, er passt nicht zur Kachel-Visu (PN #12) */
  .card.busy { opacity: 0.55; pointer-events: none; }
  .t-cover { --tone: #5b6cf0; } .t-light { --tone: #e8a800; } .t-power { --tone: #12b886; } .t-climate { --tone: #1c9fe0; }
  .t-opening { --tone: #7b8794; } .t-sensor { --tone: #f08c00; } .t-media { --tone: #9c5de6; } .t-measure { --tone: #0f9f8f; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
  .badge { font-size: 10px; color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); border-radius: 4px; padding: 2px 5px; }
  .status.short { text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; font-weight: 600; }
  .status.line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .choice { display: flex; flex-direction: column; gap: 4px; }
  .caption { color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .seg { display: flex; gap: 3px; }
  .seg button { flex: 1; padding: 4px 4px; }
  .seg button.on { color: var(--tone); background: color-mix(in srgb, var(--tone) 22%, transparent); font-weight: 600; }
  .choice select { font: inherit; font-size: 12px; color: var(--fg); background: color-mix(in srgb, var(--muted) 12%, transparent); border: 0; border-radius: 5px; padding: 4px 8px; cursor: pointer; }
  .icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex: none; color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
  .lit .icon { color: var(--tone); background: color-mix(in srgb, var(--tone) 16%, transparent); }
  .icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .room { color: var(--muted); font-size: 12px; }
  .state { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: auto; }
  .status { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .lit .status { color: color-mix(in srgb, var(--tone) 75%, var(--fg)); }
  .figure { font-size: 20px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .figure small { font-size: 12px; color: var(--muted); margin-left: 2px; font-weight: 400; }
  .reply { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .reply.error { color: var(--error); }
  .row { display: flex; align-items: center; gap: 6px; }
  .row .specials { margin-left: auto; }
  .value { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  button { font: inherit; font-size: 11px; color: var(--fg); background: color-mix(in srgb, var(--muted) 12%, transparent); border: 0; border-radius: 5px; padding: 4px 8px; cursor: pointer; min-width: 26px; line-height: 1.2; }
  button:hover { background: color-mix(in srgb, var(--tone) 25%, transparent); }
  .buttons { display: flex; gap: 3px; }
  /* Balken: zugleich Schieberegler mit rundem Griff (pitti, PN #12); ausgeschaltet grau, reine Anzeige ohne Griff */
  .bar { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 2px 0; border-radius: 3px; cursor: pointer;
    background: linear-gradient(90deg, var(--tone) 0, var(--tone) var(--fill), color-mix(in srgb, var(--muted) 18%, transparent) var(--fill)); }
  .bar.static { cursor: default; }
  .bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--tone); border: 2px solid var(--bg); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tone) 35%, transparent); }
  .bar::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--tone); border: 2px solid var(--bg); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tone) 35%, transparent); }
  /* Nicht aktiv: Balken und Griff grau (vorher war der Balken eines angehaltenen Players lila, der Griff grau) */
  .card:not(.lit) .bar { --tone: var(--inactive); }
  .bar.static::-webkit-slider-thumb { opacity: 0; }
  .bar.static::-moz-range-thumb { opacity: 0; }
  /* Farbtemperatur und Farbe beim Licht (Burkhard 16.10.2026); der gerade nicht gültige Teil ist blass */
  .dim { opacity: 0.45; }
  .capline { display: flex; justify-content: space-between; gap: 8px; }
  .ct { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 2px 0; border-radius: 3px; cursor: pointer; background: linear-gradient(90deg, #ffb46b, #cfe3ff); }
  .ct::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 2px solid var(--bg); }
  .ct::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 2px solid var(--bg); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; }
  .swatch, .swatch:hover { width: 18px; height: 18px; min-width: 18px; padding: 0; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px var(--border); }
  .swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: color-mix(in srgb, var(--muted) 25%, transparent); border-radius: 10px; cursor: pointer; transition: background 0.15s; }
  .switch span::before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .switch input:checked + span { background: var(--tone); }
  .switch input:checked + span::before { transform: translateX(14px); }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 0 4px; }
  .empty { color: var(--muted); padding: 12px 6px; }
</style>
</head>
<body>
<div id="root"><div class="empty">…</div></div>
<script>
(function () {
  "use strict";
  // Seite der Gerätekarten von Home Agent (MCP Apps, Erweiterung io.modelcontextprotocol/ui, Spezifikation 2026-01-26).
  // show_devices liefert die Karten in structuredContent; bedient wird über tools/call an control_device, das nur diese
  // Seite sieht (_meta.ui.visibility ["app"]). Was der Anwender hier tut, erfährt das Modell über ui/update-model-context.
  var nextId = 1;
  var pending = {};
  var lang = (navigator.language || "de").slice(0, 2);
  var state = null;
  var replies = {};
  var done = [];

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    var id = nextId++;
    send({ jsonrpc: "2.0", id: id, method: method, params: params });
    return new Promise(function (resolve, reject) { pending[id] = { resolve: resolve, reject: reject }; });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params || {} }); }

  function applyContext(context) {
    if (!context) { return; }
    if (context.theme === "dark" || context.theme === "light") {
      document.documentElement.setAttribute("data-theme", context.theme);
    }
    var vars = context.styles && context.styles.variables;
    if (vars) {
      Object.keys(vars).forEach(function (key) {
        if (vars[key]) { document.documentElement.style.setProperty(key, vars[key]); }
      });
    }
    if (context.locale) { lang = String(context.locale).slice(0, 2); }
  }

  var lastHeight = 0;
  // Höhe des Inhalts, nicht des Rahmens (wie beim Diagramm, sonst bleibt ein Scrollbalken).
  function reportSize() {
    var height = Math.ceil(document.getElementById("root").getBoundingClientRect().bottom + 8);
    if (height !== lastHeight) {
      lastHeight = height;
      notify("ui/notifications/size-changed", { width: Math.ceil(document.body.getBoundingClientRect().width), height: height });
    }
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) { el.className = className; }
    if (text !== undefined) { el.textContent = text; }
    return el;
  }
  function button(label, title, onClick) {
    var b = node("button", "", label);
    b.title = title;
    b.setAttribute("aria-label", title);
    b.addEventListener("click", onClick);
    return b;
  }
  // Symbole je Typ, Linien im Raster 24 × 24
  var ICONS = {
    light: "M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z",
    blind: "M4 4h16M6 4v13M18 4v13M6 8h12M6 12h12M6 16h12M12 17v3",
    switch: "M7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zM12 8v8",
    socket: "M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM9.5 10v3M14.5 10v3",
    appliance: "M13 2 4 14h7l-1 8 9-12h-7z",
    thermostat: "M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0zM12 11v6",
    temperature: "M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0zM12 11v6",
    humidity: "M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z",
    humidifier: "M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11zM9.5 14.5a2.5 2.5 0 0 0 2.5 2.5",
    fan: "M12 12m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0M12 10.5C12 6 13 3.5 15.5 3.5s2.5 4-2 7M13.5 12c4.5 0 7 1 7 3.5s-4 2.5-7-2M12 13.5c0 4.5-1 7-3.5 7s-2.5-4 2-7M10.5 12C6 12 3.5 11 3.5 8.5s4-2.5 7 2",
    air_quality: "M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7",
    measurement: "M4 18a8 8 0 1 1 16 0M12 18l4-6",
    window: "M5 3h14v18H5zM12 3v18M5 12h14",
    door: "M6 21V3h12v18M3 21h18M14.5 12h.01",
    presence: "M12 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21v-3a6 6 0 0 1 12 0v3",
    water_leak: "M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11zM4 21h16",
    media: "M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
  };
  function icon(type) {
    var box = node("div", "icon");
    var svgNs = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNs, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    var path = document.createElementNS(svgNs, "path");
    path.setAttribute("d", ICONS[type] || ICONS.measurement);
    svg.appendChild(path);
    box.appendChild(svg);
    return box;
  }
  // Zahl aus der Anlage („21.7“) in der Schreibweise des Anwenders, mit so vielen Nachkommastellen wie geliefert
  function localNumber(text) {
    if (!/^-?\d+([.,]\d+)?$/.test(text)) { return text; }
    var decimals = (text.split(/[.,]/)[1] || "").length;
    return Number(text.replace(",", ".")).toLocaleString(lang, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function number(value) {
    return (Math.round(value * 10) / 10).toLocaleString(lang);
  }

  // Ein Gerät bedienen: Karte sperren, control_device aufrufen, die neue Karte und die Antwort zeigen, dem Modell
  // sagen, was geschah. Jede Meldung an das Modell ersetzt die vorige, deshalb gehen die letzten fünf zusammen hin.
  function control(card, args, element) {
    if (busy[card.key]) { return; }
    busy[card.key] = true;
    element.classList.add("busy");
    var call = { device: card.key };
    Object.keys(args).forEach(function (key) { call[key] = args[key]; });
    request("tools/call", { name: "control_device", arguments: call }).then(function (result) {
      delete busy[card.key];
      var text = ((result && result.content) || []).map(function (c) { return c.text || ""; }).join("\n");
      var fresh = result && result.structuredContent && result.structuredContent.cards && result.structuredContent.cards[0];
      // Die Antwort nur bei einem Problem (nicht bestätigt, Fehler, nicht verstanden); sonst zeigt die Karte den neuen Zustand
      if (result && (result.isError || (result.structuredContent && result.structuredContent.problem))) {
        replies[card.key] = { text: text, error: !!result.isError };
      } else {
        delete replies[card.key];
      }
      if (fresh) { replace(fresh); } else { redraw(card.key); }
      if (fresh && (fresh.moving || (result.structuredContent && result.structuredContent.problem === "not_confirmed"))) {
        watch(card.key, Date.now(), 0);
      }
      done.push(card.room + " · " + card.name + ": " + text.split("\n")[0]);
      done = done.slice(-5);
      request("ui/update-model-context", { content: [{ type: "text", text: "Operated on the device cards by the user:\n" + done.join("\n") }] }).catch(function () {});
    }, function (error) {
      delete busy[card.key];
      replies[card.key] = { text: (error && error.message) || "–", error: true };
      redraw(card.key);
    });
  }

  // Solange ein Gerät fährt (Velux 30 s, Fensterantrieb 45 s) oder ein Befehl noch nicht bestätigt ist, holt die Seite
  // die Karte alle drei Sekunden neu: control_device nur mit dem Schlüssel schaltet nichts. Burkhard 13.10.2026: die
  // Karte blieb bei „fährt auf 90 % offen (derzeit offen)“ stehen. Ohne Fahrt zweimal, höchstens 90 Sekunden.
  var watches = {}, busy = {}, showRoom = false;
  function watch(key, started, round) {
    if (watches[key]) { clearTimeout(watches[key]); }
    watches[key] = setTimeout(function () {
      delete watches[key];
      request("tools/call", { name: "control_device", arguments: { device: key } }).then(function (result) {
        var fresh = result && result.structuredContent && result.structuredContent.cards && result.structuredContent.cards[0];
        if (!fresh) { return; }
        if (!fresh.moving) { delete replies[key]; }
        replace(fresh);
        if ((fresh.moving || round < 1) && Date.now() - started < 90000) { watch(key, started, round + 1); }
      }, function () {});
    }, 3000);
  }

  function replace(fresh) {
    if (!state) { return; }
    var old = null;
    state.cards = state.cards.map(function (c) {
      if (c.key !== fresh.key) { return c; }
      old = c;
      return fresh;
    });
    if (old && (old.group || "sensor") !== (fresh.group || "sensor")) { draw(); } else { redraw(fresh.key); }
  }

  // Eine Karte neu zeichnen, ohne die anderen anzufassen (Review 14.10.2026: jede Nachfrage baute alle Karten neu, ein
  // gezogener Regler schickte seinen Zwischenwert, eine offene Auswahl klappte zu, die Sperre einer Karte fiel weg).
  // Bedient der Anwender die Karte gerade (Maus oder Finger gedrückt, Auswahl im Fokus), wartet das Neuzeichnen.
  var held = null, deferred = {};
  function inUse(el) {
    var active = document.activeElement;
    return (held !== null && el.contains(held)) || (active && active.tagName === "SELECT" && el.contains(active));
  }
  function redraw(key) {
    var el = document.querySelector('.card[data-key="' + CSS.escape(key) + '"]');
    var card = state && state.cards.filter(function (c) { return c.key === key; })[0];
    if (!el || !card) { draw(); return; }
    if (inUse(el)) { deferred[key] = true; return; }
    delete deferred[key];
    el.replaceWith(cardElement(card, showRoom));
    reportSize();
  }
  function flush() {
    setTimeout(function () { Object.keys(deferred).forEach(redraw); }, 0);
  }
  document.addEventListener("pointerdown", function (event) { held = event.target; }, true);
  document.addEventListener("pointerup", function () { held = null; flush(); }, true);
  document.addEventListener("pointercancel", function () { held = null; flush(); }, true);
  document.addEventListener("focusout", flush, true);

  // Bis zu fünf kurze Einträge als Knopfleiste, sonst ein Aufklappmenü (pitti, PN #12)
  function choiceElement(card, choice, el) {
    var box = node("div", "choice");
    box.appendChild(node("div", "caption", choice.label));
    var send = function (entry) {
      var args = {};
      args[choice.field] = entry;
      control(card, args, el);
    };
    var short = choice.entries.length <= 5 && choice.entries.join("").length <= 24;
    if (short) {
      var seg = node("div", "seg");
      choice.entries.forEach(function (entry) {
        var b = button(entry, choice.label + ": " + entry, function () { if (entry !== choice.value) { send(entry); } });
        if (entry === choice.value) { b.className = "on"; b.setAttribute("aria-pressed", "true"); }
        seg.appendChild(b);
      });
      box.appendChild(seg);
    } else {
      var select = node("select");
      select.setAttribute("aria-label", choice.label);
      if (choice.value === null) { select.appendChild(node("option", null, "–")); }
      choice.entries.forEach(function (entry) {
        var option = node("option", null, entry);
        option.value = entry;
        option.selected = entry === choice.value;
        select.appendChild(option);
      });
      select.addEventListener("change", function () { send(select.value); });
      box.appendChild(select);
    }
    return box;
  }

  // Balken für Stufe, Öffnungsgrad und Lautstärke; bedienbar nur mit Fähigkeit (field), sonst nur Anzeige
  function barElement(card, value, field, figure, el) {
    var bar = node("input", "bar" + (field ? "" : " static"));
    bar.type = "range";
    bar.min = "0";
    bar.max = "100";
    bar.step = "1";
    bar.value = String(value);
    bar.style.setProperty("--fill", value + "%");
    bar.setAttribute("aria-label", card.name);
    if (!field) {
      bar.disabled = true;
      return bar;
    }
    bar.addEventListener("input", function () {
      bar.style.setProperty("--fill", bar.value + "%");
      figure.textContent = bar.value;
      figure.appendChild(node("small", "", "%"));
    });
    bar.addEventListener("change", function () {
      var args = {};
      args[field] = Number(bar.value);
      control(card, args, el);
    });
    return bar;
  }

  // Farbtemperatur in Kelvin: Regler von warm nach kalt, der Wert steht rechts neben der Beschriftung
  function kelvinElement(card, ct, el) {
    var box = node("div", "choice" + (ct.active ? "" : " dim"));
    var head = node("div", "capline");
    head.appendChild(node("div", "caption", ct.label));
    var shown = node("div", "caption", ct.value === null ? "–" : ct.value + " K");
    head.appendChild(shown);
    box.appendChild(head);
    var bar = node("input", "ct");
    bar.type = "range";
    bar.min = String(ct.min);
    bar.max = String(ct.max);
    bar.step = "50";
    bar.value = String(ct.value === null ? Math.round((ct.min + ct.max) / 2) : Math.min(ct.max, Math.max(ct.min, ct.value)));
    bar.setAttribute("aria-label", card.name + ": " + ct.label);
    bar.addEventListener("input", function () { shown.textContent = bar.value + " K"; });
    bar.addEventListener("change", function () { control(card, { color_temperature: Number(bar.value) }, el); });
    box.appendChild(bar);
    return box;
  }

  // Farbe: Tupfer aus der festen Liste des Moduls, gesendet wird der Name
  function colorElement(card, co, el) {
    var box = node("div", "choice" + (co.active ? "" : " dim"));
    box.appendChild(node("div", "caption", co.label));
    var row = node("div", "swatches");
    co.entries.forEach(function (entry) {
      var b = button("", entry.label, function () { if (entry.name !== co.value) { control(card, { color: entry.name }, el); } });
      b.className = "swatch" + (entry.name === co.value ? " on" : "");
      b.style.setProperty("--c", entry.rgb);
      b.setAttribute("aria-label", co.label + ": " + entry.label);
      if (entry.name === co.value) { b.setAttribute("aria-pressed", "true"); }
      row.appendChild(b);
    });
    box.appendChild(row);
    return box;
  }

  // Aufbau nach pitti (PN #11): Name oben, darunter Symbol und Bedienung, dann Zustand und Wert, dann Balken
  function cardElement(card, showRoom) {
    var group = card.group || "sensor";
    var labels = (state && state.labels) || {};
    // Farbig ist, was an ist; Rollläden und Klimawerte haben keinen Aus-Zustand und sind es immer
    var lit = card.active === true || (card.active === null && (group === "cover" || group === "climate" || group === "measure"));
    var el = node("div", "card t-" + group + (lit ? " lit" : "") + (busy[card.key] ? " busy" : ""));
    el.setAttribute("data-key", card.key);
    var c = card.controls || {};

    var title = node("div");
    title.appendChild(node("div", "name", card.name));
    if (showRoom) { title.appendChild(node("div", "room", card.room)); }
    el.appendChild(title);

    var top = node("div", "top");
    top.appendChild(icon(card.type));
    if (c.playback) {
      var play = node("div", "buttons");
      var playing = card.active === true;
      [["⏮", "previous"], playing ? ["⏸", "pause"] : ["▶", "play"], ["⏭", "next"]].forEach(function (b) {
        play.appendChild(button(b[0], b[1], function () { control(card, { command: b[1] }, el); }));
      });
      top.appendChild(play);
    } else if (c.switch) {
      var label = node("label", "switch");
      var box = node("input");
      box.type = "checkbox";
      box.checked = card.active === true;
      box.setAttribute("aria-label", card.name);
      box.addEventListener("change", function () { control(card, { command: box.checked ? "on" : "off" }, el); });
      label.appendChild(box);
      label.appendChild(node("span"));
      top.appendChild(label);
    } else if (c.cover) {
      var cover = node("div", "buttons");
      cover.appendChild(button("▲", "open", function () { control(card, { command: "open" }, el); }));
      if (c.cover.stop) { cover.appendChild(button("■", "stop", function () { control(card, { command: "stop" }, el); })); }
      cover.appendChild(button("▼", "close", function () { control(card, { command: "close" }, el); }));
      top.appendChild(cover);
    } else if (group === "opening" && card.active === false && labels.shut) {
      top.appendChild(node("span", "badge", labels.shut));
    }
    el.appendChild(top);

    var row = node("div", "state");
    var status = card.status === undefined ? card.text : card.status;
    if (status === null) { status = labels.current || ""; }
    // Kurze Zustände in Großbuchstaben wie bei pitti, lange (Titel, Sollwert mit Modus) normal und Titel einzeilig
    var statusClass = "status" + (status.length <= 14 ? " short" : "") + (group === "media" ? " line" : "");
    var statusNode = node("div", statusClass, status);
    statusNode.title = status;
    row.appendChild(statusNode);
    var figure = node("div", "figure");
    if (card.figure) {
      figure.textContent = localNumber(card.figure.value);
      figure.appendChild(node("small", "", card.figure.unit));
    } else {
      // Ohne Hauptwert die Höhe einer Zahl, damit einfache Karten einer Zeile gleich hoch bleiben
      figure.textContent = "\u200b";
    }
    row.appendChild(figure);
    el.appendChild(row);

    if (c.percent !== undefined) {
      // Ein ausgeschaltetes Licht steht auf 0, auch wenn die Stufe gemerkt ist
      el.appendChild(barElement(card, c.percent === null || (group === "light" && card.active === false) ? 0 : c.percent, "percent", figure, el));
    } else if (c.volume !== undefined) {
      el.appendChild(barElement(card, c.volume === null ? 0 : c.volume, "volume", figure, el));
    } else if (card.figure && card.figure.unit === "%" && (group === "cover" || group === "light" || group === "media")) {
      el.appendChild(barElement(card, Number(card.figure.value), null, figure, el));
    }
    if (c.setpoint) {
      var sp = c.setpoint;
      var setRow = node("div", "row");
      var setValue = node("span", "value", sp.valueCaption ? sp.valueCaption : sp.value === null ? "–" : number(sp.value) + " " + sp.unit);
      // Die Ziele rechnet das Modul (auch für Sonderwerte außerhalb des Bereichs)
      var change = function (direction) {
        var target = direction < 0 ? sp.lower : sp.raise;
        if (target === null || target === undefined) { return; }
        var args = {};
        args[sp.field] = target;
        control(card, args, el);
      };
      setRow.appendChild(button("−", "lower", function () { change(-1); }));
      setRow.appendChild(setValue);
      setRow.appendChild(button("+", "raise", function () { change(1); }));
      // Sonder-Sollwerte („Off“, „On“) rechts daneben als Knopfleiste; gesendet wird der Befehl, den Wert kennt das Modul
      if (sp.specials && sp.specials.length) {
        var specials = node("div", "seg specials");
        sp.specials.forEach(function (special) {
          var b = button(special.caption, (sp.label || "") + ": " + special.caption, function () {
            if (!special.active) { control(card, { command: special.command }, el); }
          });
          if (special.active) { b.className = "on"; b.setAttribute("aria-pressed", "true"); }
          specials.appendChild(b);
        });
        setRow.appendChild(specials);
      }
      var setBox = node("div", "choice");
      if (sp.label) { setBox.appendChild(node("div", "caption", sp.label)); }
      setBox.appendChild(setRow);
      el.appendChild(setBox);
    }
    // Auswahl (Modus, Lüfterstufe): gesendet wird die Beschriftung, das Modul sucht den Wert dazu
    (c.options || []).forEach(function (choice) { el.appendChild(choiceElement(card, choice, el)); });
    if (c.colortemp) { el.appendChild(kelvinElement(card, c.colortemp, el)); }
    if (c.color) { el.appendChild(colorElement(card, c.color, el)); }
    var reply = replies[card.key];
    if (reply) { el.appendChild(node("div", "reply" + (reply.error ? " error" : ""), reply.text)); }
    return el;
  }
  function draw() {
    var root = document.getElementById("root");
    root.textContent = "";
    if (!state || !state.cards || !state.cards.length) {
      root.appendChild(node("div", "empty", "–"));
      reportSize();
      return;
    }
    // Den Raum nennt die Karte nur, wenn die Geräte aus mehreren Räumen kommen; Überschriften erst ab zwei Gruppen
    var rooms = {};
    state.cards.forEach(function (card) { rooms[card.room] = true; });
    showRoom = Object.keys(rooms).length > 1;
    deferred = {};
    var order = (state.labels && state.labels.groups) || [];
    var groups = [];
    order.forEach(function (g) {
      var cards = state.cards.filter(function (card) { return (card.group || "sensor") === g[0]; });
      if (cards.length) { groups.push({ label: g[1], cards: cards }); }
    });
    var placed = groups.reduce(function (n, g) { return n + g.cards.length; }, 0);
    if (placed !== state.cards.length) { groups = [{ label: "", cards: state.cards }]; }
    groups.forEach(function (g) {
      if (groups.length > 1) { root.appendChild(node("div", "group", g.label)); }
      var grid = node("div", "grid");
      g.cards.forEach(function (card) { grid.appendChild(cardElement(card, showRoom)); });
      root.appendChild(grid);
    });
    if (state.more > 0 && state.labels && state.labels.more) {
      root.appendChild(node("p", "note", state.labels.more.replace("%d", String(state.more))));
    }
    reportSize();
  }

  // Ergebnis eines Werkzeugs: die Karten von show_devices ersetzen alles; eine einzelne Karte von control_device, die
  // der Host ebenfalls hierher schicken darf, ersetzt nur ihre eigene.
  function render(data) {
    if (!data || data.kind !== "cards") { return; }
    if (state && data.cards && data.cards.length === 1 && state.cards.some(function (c) { return c.key === data.cards[0].key; })) {
      replace(data.cards[0]);
      return;
    }
    state = data;
    replies = {};
    draw();
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) { return; }
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") { return; }
    if (msg.id !== undefined && pending[msg.id] && (msg.result !== undefined || msg.error !== undefined)) {
      var entry = pending[msg.id];
      delete pending[msg.id];
      if (msg.error) { entry.reject(msg.error); } else { entry.resolve(msg.result); }
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      render((msg.params || {}).structuredContent);
    } else if (msg.method === "ui/notifications/host-context-changed") {
      applyContext(msg.params);
    } else if (msg.id !== undefined && msg.method) {
      // ping, ui/resource-teardown und Ähnliches: ohne Aufwand bestätigen
      send({ jsonrpc: "2.0", id: msg.id, result: {} });
    }
  });

  if (window.ResizeObserver) { new ResizeObserver(reportSize).observe(document.documentElement); }

  request("ui/initialize", {
    appCapabilities: {},
    appInfo: { name: "Home Agent devices", version: "1.0.0" },
    protocolVersion: "2026-01-26"
  }).then(function (result) {
    applyContext(result && result.hostContext);
    notify("ui/notifications/initialized");
  }, function () {
    notify("ui/notifications/initialized");
  });
})();
</script>
</body>
</html>
